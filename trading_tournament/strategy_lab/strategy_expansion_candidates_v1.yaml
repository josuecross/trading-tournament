- candidate_id: dmr_liquid_etf_oversold_rebound_v1
  strategy_name: Liquid ETF Oversold Rebound
  priority_rank: 1
  priority_group: priority_1_immediate_daily_weekly
  family: daily_mean_reversion
  edge_type: mean_reversion
  timeframe: daily
  status: daily_research_candidate
  demo_eligibility: daily_demo_review_possible_after_validation
  instruments:
  - SPY
  - QQQ
  - IWM
  - DIA
  - XLK
  - XLF
  - XLV
  - XLE
  - XLI
  - XLY
  - XLP
  - XLU
  - XLB
  - XLRE
  allowed_universe: Highly liquid broad and sector ETFs only; no single stocks, leverage, shorts, options, futures, forex,
    or crypto.
  core_hypothesis: Short-horizon ETF oversold rebounds can be profitable when the instrument and market backdrop remain in
    healthy long-term uptrends.
  entry_rule: At the daily close, rank eligible ETFs with close above their 200-day SMA and SPY above its 200-day SMA by RSI(2).
    Enter the two lowest RSI(2) readings only when RSI(2) <= 10.
  exit_rule: Exit at the next daily close above the 5-day SMA, on a 2.0 ATR(14) stop from entry, after 5 trading days, or
    when SPY closes below its 200-day SMA.
  sizing_rule: Equal risk slots with at most two open ETF positions; unused cash remains cash/BIL proxy in reporting.
  risk_controls:
  - Max 2 open positions.
  - Max 25% notional per position.
  - ATR stop required on every entry.
  - Max 2 new entries per day.
  - Pause new entries for the rest of the week after two closed losing trades or a 3% strategy drawdown in the same week.
  max_position_size: 25% notional per position
  max_open_positions: 2
  max_trades_per_day: 2
  max_trades_per_week: 6
  max_holding_period: 5 trading days
  data_required:
  - Adjusted daily OHLCV for eligible ETFs
  - RSI(2)
  - 5-day SMA
  - 200-day SMA
  - ATR(14)
  execution_assumptions:
  - End-of-day signal
  - Next session open or close simulation must be declared before testing
  - No intraday fills assumed
  benchmark_controls:
  - SPY buy-and-hold
  - SPY 200d trend model
  - active VM
  - active DSR
  - active combo benchmark
  minimum_backtest_period: At least 10 years when data exists, including 2018, 2020, 2022, and 2025-2026 windows.
  minimum_acceptance_criteria:
  - Positive median final equity after costs in sampled and full windows.
  - Beats SPY 200d and active combo on risk-adjusted return or materially improves drawdown at comparable return.
  - No single ETF accounts for most of the edge.
  rejection_criteria:
  - Fails drawdown buffer versus active references.
  - Profit concentrated in one crisis rebound.
  - Turnover costs erase edge.
  main_failure_modes:
  - Mean reversion keeps catching falling ETFs
  - RSI threshold is too sparse or too crowded
  - Sector correlations create hidden concentration
  related_tested_strategies:
  - SPY_200d_trend_model
  - active_combo_vm_dsr_equal_weight_v1
  - breadth_state_regime_lane
  duplication_checks:
  - Must not reduce to active VM trend filter only
  - Must not be a near-duplicate of previous ETF wrapper defensive shifts
  diversity_family: mean-reversion
  instrument_scope: broad ETFs; sector ETFs
  risk_level: medium
  execution_difficulty: low
  next_action: pre_register_before_any_backtest
- candidate_id: vm_spy_qqq_daily_vol_target_v1
  strategy_name: SPY QQQ Daily Volatility Target
  priority_rank: 2
  priority_group: priority_1_immediate_daily_weekly
  family: volatility_managed_equity
  edge_type: volatility_management
  timeframe: daily
  status: daily_research_candidate
  demo_eligibility: daily_demo_review_possible_after_validation
  instruments:
  - SPY
  - QQQ
  - BIL
  allowed_universe: SPY, QQQ, and BIL only; long-only exposure with no leverage.
  core_hypothesis: Trend-following equity exposure may improve small-account survivability if exposure is scaled down during
    high realized-volatility regimes.
  entry_rule: Hold SPY and QQQ when each closes above its 200-day SMA and SPY closes above its 200-day SMA; otherwise assign
    that sleeve to BIL.
  exit_rule: Reduce or exit a sleeve when its close falls below the 200-day SMA, when a pre-registered realized volatility
    spike block is active, or at the next rebalance.
  sizing_rule: Target 50% SPY and 50% QQQ in calm volatility, 25%/25% in elevated volatility, and residual allocation to BIL;
    never exceed 100% total notional.
  risk_controls:
  - No leverage and no margin.
  - Max 100% total notional exposure.
  - Residual allocation goes to BIL.
  - Drawdown pause blocks new risk increases.
  - Volatility spike condition can only reduce exposure, never increase it.
  max_position_size: 50% notional per equity ETF before volatility scaling
  max_open_positions: 3
  max_trades_per_day: 2
  max_trades_per_week: 4
  max_holding_period: Open-ended while daily rules remain valid
  data_required:
  - Adjusted daily OHLCV for SPY, QQQ, BIL
  - 200-day SMA
  - 20-day realized volatility
  - 60-day realized volatility
  execution_assumptions:
  - End-of-day signal
  - Daily rebalance only when target exposure changes
  - BIL used as cash proxy
  benchmark_controls:
  - active VM
  - SPY 200d trend model
  - active combo benchmark
  - SPY/QQQ 50/50 buy-and-hold
  minimum_backtest_period: At least 15 years when available, with explicit 2020 and 2022 stress windows.
  minimum_acceptance_criteria:
  - Distinct from active VM after rule comparison.
  - Improves drawdown or volatility materially versus 50/50 SPY/QQQ without unacceptable return drag.
  - Does not lag active VM and active combo by enough to fail the profit goal.
  rejection_criteria:
  - Near-duplicate of active VM.
  - Volatility scaling removes too much upside.
  - High-volatility whipsaw produces worse drawdown and lower return.
  main_failure_modes:
  - Hidden duplication with active VM
  - Late volatility response
  - Too much BIL drag
  related_tested_strategies:
  - paper_forward_vm_quality_lowvol_proxy_v1
  - SPY_200d_trend_model
  - active_combo_vm_dsr_equal_weight_v1
  duplication_checks:
  - Compare holdings, exposure path, drawdown path, and signal dates against active VM before any promotion review
  diversity_family: volatility-management
  instrument_scope: risk-on/risk-off pair
  risk_level: medium
  execution_difficulty: low
  next_action: pre_register_before_any_backtest
- candidate_id: sector_rs_weekly_cash_filter_v1
  strategy_name: Weekly Sector Relative Strength Cash Filter
  priority_rank: 3
  priority_group: priority_1_immediate_daily_weekly
  family: sector_relative_strength_rotation
  edge_type: sector_rotation
  timeframe: weekly
  status: registered_not_tested
  demo_eligibility: weekly_demo_review_possible_after_validation
  instruments:
  - XLK
  - XLF
  - XLV
  - XLE
  - XLI
  - XLY
  - XLP
  - XLU
  - XLB
  - XLRE
  - BIL
  allowed_universe: Liquid sector ETFs and BIL only.
  core_hypothesis: Weekly sector leadership with an explicit cash filter may capture medium-term rotation without the slower
    behavior of monthly ETF-wrapper rows.
  entry_rule: On the final trading day of each week, rank sectors by fixed 13-week total return; hold the top two only if
    each closes above its 26-week SMA and SPY closes above its 40-week SMA.
  exit_rule: Exit a sector at weekly rebalance if it falls out of the top two, fails its 26-week SMA filter, or SPY fails
    the 40-week SMA filter; allocate failed sleeves to BIL.
  sizing_rule: Allocate 50% to each selected sector; failed or missing slots go to BIL.
  risk_controls:
  - Max 2 sector positions.
  - 50% cap per sector.
  - Weekly rebalance only.
  - BIL fallback for weak sectors.
  - Pause new sector entries for one week after a 5% strategy drawdown from prior month-end equity.
  max_position_size: 50% notional per sector ETF
  max_open_positions: 2
  max_trades_per_day: 2
  max_trades_per_week: 4
  max_holding_period: Open-ended while weekly rules remain valid
  data_required:
  - Adjusted daily OHLCV converted to weekly bars
  - 13-week total return
  - 26-week SMA
  - 40-week SPY SMA
  execution_assumptions:
  - Weekly signal only
  - No intraday decisioning
  - No sector shorting
  benchmark_controls:
  - active DSR
  - active combo benchmark
  - equal-weight sector basket
  - SPY 200d trend model
  minimum_backtest_period: At least 15 years where sector ETF history permits; include rate-shock and bear-market windows.
  minimum_acceptance_criteria:
  - Not a near-duplicate of active DSR.
  - Beats equal-weight sectors and active combo on either median final equity or drawdown-adjusted return.
  - Turnover remains within cap without excessive whipsaw.
  rejection_criteria:
  - Weaker than active DSR and active combo.
  - Returns dominated by XLK-only concentration.
  - Cash filter causes persistent underinvestment.
  main_failure_modes:
  - Sector momentum reverses quickly
  - Hidden XLK/QQQ concentration
  - Weekly filter too slow
  related_tested_strategies:
  - paper_forward_dsr_sector_equal_weight_defensive_filter_v1
  - active_combo_vm_dsr_equal_weight_v1
  - dsr_sector_top2_momentum_200d_bil_v1
  duplication_checks:
  - Compare selected sectors, rebalance dates, BIL usage, and return sources against active DSR
  diversity_family: sector-rotation
  instrument_scope: sector ETFs
  risk_level: medium
  execution_difficulty: low
  next_action: pre_register_before_any_backtest
