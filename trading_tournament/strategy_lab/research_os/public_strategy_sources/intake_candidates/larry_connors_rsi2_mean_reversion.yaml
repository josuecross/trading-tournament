schema_version: 1
intake_status: manual_source_supplied_for_validation
source:
  source_id: larry_connors_rsi2_mean_reversion
  source_name: Larry Connors 2-Period RSI Mean Reversion
  source_url_or_citation: "StockCharts ChartSchool: RSI(2); WH SelfInvest: The RSI 2P Strategy from Larry Connors"
  source_type: public practitioner strategy documentation
  source_evidence_public_context_only: true
strategy_description:
  strategy_family: short_term_equity_mean_reversion
  claimed_hypothesis: Equity indexes in a broader uptrend may mean-revert after very short-term oversold conditions; a deeply oversold 2-period RSI can identify pullbacks within an uptrend.
  rule_clarity: clear_and_testable
  instruments:
    - SPY
    - BIL
  timeframe: daily
rules:
  entry_rule: Enter long SPY when SPY is above its 200-day simple moving average and RSI(2) closes below 5.
  exit_rule: Exit SPY and allocate to BIL/cash when SPY closes above its 5-day simple moving average.
  ranking_selection_rule: not_applicable; this is a single-instrument short-term mean-reversion timing rule.
  rebalance_frequency: daily signal check using end-of-day data.
  risk_controls: Long-only SPY exposure; BIL/cash fallback when not in trade; 200-day SMA trend filter; no short side; no leverage; no options/futures; no intraday execution.
data_and_execution:
  data_requirements: Daily adjusted close data for SPY and BIL; enough history to compute 200-day SMA, 5-day SMA, and 2-period RSI.
  execution_assumptions: Signals are computed after the daily close; target weights are applied using the project no-lookahead shifted-weight convention; BIL is used as the cash proxy outside active SPY positions.
  compatible_with_bt_adapter: true
project_screening:
  project_constraint_violations: []
  similar_already_tested_project_families: []
  do_not_retest_match: none
