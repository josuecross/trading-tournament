project_notes:
  source_evidence_status: public_source_context_only_not_profitability_proof
  similarity_risk_vs_project: low_to_medium
  similarity_notes: This differs from the already tested allocation, momentum, macro, commodity, calendar, and volatility-control lanes because the core hypothesis is short-term mean reversion. Similarity risk is moderate only because it still uses SPY, BIL, and a 200-day trend filter.
  source_uncertainty: StockCharts describes RSI(2) below 10 as deeply oversold; WH SelfInvest gives a stricter long-entry threshold of RSI(2) below 5 and an exit above the 5-period moving average. This intake uses the WH SelfInvest rule as the frozen implementation source.
  expected_bridge_decision: eligible_for_bounded_bt_design
