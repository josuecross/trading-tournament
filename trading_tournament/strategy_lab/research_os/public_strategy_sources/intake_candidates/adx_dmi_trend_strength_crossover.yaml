project_notes:
  source_evidence_status: public_source_context_only_not_profitability_proof
  similarity_risk_vs_project: medium
  similarity_notes: This overlaps with completed SPY/BIL timing, trend, and equity-risk-control project context, but the frozen intake rule is a DMI/ADX trend-strength crossover rather than SPY_200d, calendar timing, mean reversion, Coppock, CCI, MACD/Stochastic, Bollinger squeeze, Percent B/MFI, global allocation, macro/risk-off, or volatility-managed equity logic.
  long_only_adaptation_caveat: Public DMI/ADX materials can be used for long or bearish directional interpretation. This project intake freezes only a long-only SPY/BIL adaptation; bearish -DI dominance or absent bullish confirmation maps to BIL/cash, never short, inverse, leveraged, options, futures, margin, intraday, paper-order, live-order, or real-money logic.
  formula_parameter_completeness_status: adx_dmi_period_threshold_and_direction_rules_source_backed_complete
  formula_parameter_uncertainty: ADX/DMI period 14 and ADX threshold 25 are recorded as source-backed intake parameters. Alternative thresholds such as 20 are noted by sources but are not used, optimized, swept, or treated as authorization for tuning.
  entry_rule_completeness_status: adx_dmi_entry_rule_source_backed_complete
  entry_rule_uncertainty: The entry rule is frozen as +DI(14) crossing above -DI(14) with ADX(14) above 25 on completed daily close; this does not add SPY_200d, RSI, MACD, Bollinger, CCI, volume, stops, or profit-target filters.
  exit_rule_completeness_status: adx_dmi_exit_cash_rule_source_backed_complete
  exit_rule_uncertainty: The long-only exit/cash mapping uses -DI(14) crossing above +DI(14) or absence of valid bullish state to map to BIL/cash. This is an intake-only adaptation and not proof of profitability.
  indicator_defaults_completeness_status: adx_dmi_defaults_source_backed_complete
  indicator_defaults_uncertainty: ADX is lagging and does not predict future prices; ADX measures strength but not direction, so +DI/-DI direction context is part of the frozen intake rule.
