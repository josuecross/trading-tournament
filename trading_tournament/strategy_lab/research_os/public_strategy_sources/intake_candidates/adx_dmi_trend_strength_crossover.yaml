schema_version: 1
intake_status: manual_source_supplied_for_validation
source:
  source_id: adx_dmi_trend_strength_crossover
  source_name: ADX / DMI Trend Strength Crossover
  source_url_or_citation: "Investopedia, \"ADX Explained: How to Measure and Trade Trend Strength\"; Investopedia, \"DMI Points the Way to Profits\""
  source_type: public practitioner / technical indicator documentation
  source_evidence_public_context_only: true
strategy_description:
  strategy_family: equity_index_adx_dmi_trend_strength
  claimed_hypothesis: A +DI/-DI bullish directional crossover confirmed by ADX trend strength may identify tradable SPY uptrends; BIL/cash is used outside confirmed bullish states.
  rule_clarity: clear_and_testable
  instruments:
    - SPY
    - BIL
  timeframe: daily
rules:
  entry_rule: Enter or hold SPY when daily +DI(14) crosses above -DI(14) and ADX(14) is above 25 on the completed daily close.
  exit_rule: Continue holding SPY while +DI remains above -DI; exit SPY to BIL/cash when daily -DI(14) crosses above +DI(14), or hold BIL/cash when no valid bullish state exists.
  ranking_selection_rule: not_applicable; this is a single-instrument SPY/BIL trend-strength timing rule.
  rebalance_frequency: daily signal check using completed daily OHLC data.
  risk_controls: Long-only SPY exposure only during confirmed bullish +DI/-DI states with ADX trend-strength confirmation; BIL/cash fallback outside confirmed bullish states; no shorting; no inverse ETFs; no leverage; no options/futures; no margin; no intraday execution.
indicator_definitions:
  dmi_adx_period: 14
  adx_trend_strength_threshold: 25
  bullish_direction_state: +DI above -DI
  bearish_or_cash_direction_state: -DI above +DI
  entry_confirmation: +DI(14) crosses above -DI(14) with ADX(14) above 25 on completed daily close
  exit_confirmation: -DI(14) crosses above +DI(14) on completed daily close
  adx_direction_caveat: ADX measures trend strength, not direction; +DI and -DI provide directional context.
  source_backed_parameters: true
  tuned_parameters: false
  alternate_parameters_added: false
  default_status: adx_dmi_period_and_threshold_source_backed_not_tuned
data_and_execution:
  data_requirements: Daily adjusted OHLC data for SPY and BIL sufficient to compute DMI/ADX(14), +DI, -DI, and ADX trend-strength confirmation.
  execution_assumptions: Signals use completed daily OHLC data only; target weights would use the project no-lookahead shifted-weight convention; BIL is the cash proxy outside active SPY positions; no intraday data, provider download, broker API, paper order, live order, or real-money path is required.
  compatible_with_bt_adapter: true
