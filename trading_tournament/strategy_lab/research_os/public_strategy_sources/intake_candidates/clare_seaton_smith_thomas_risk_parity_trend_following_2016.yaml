  - Conclusion, pages 14-15
  source_evidence_public_context_only: true
strategy_description:
  strategy_family: risk_parity_inverse_volatility_or_vol_targeting
  claimed_hypothesis: Global asset classes can be combined using inverse-volatility
    risk allocation while independent 10-month moving-average trend filters transfer
    below-trend asset weights to Treasury bills.
  rule_clarity: clear_and_testable_subject_to_etf_wrapper_mapping
  instruments:
  - developed_market_equities_wrapper_required
  - emerging_market_equities_wrapper_required
  - government_bonds_wrapper_required
  - broad_commodities_wrapper_required
  - global_real_estate_wrapper_required
  - BIL
  timeframe: monthly signals and monthly rebalance using daily or monthly adjusted
    close data
rules:
  risk_allocation_rule: Estimate each asset class's volatility from the preceding
    12 months, assign weights proportional to inverse volatility, normalize weights
    so total exposure is 100%, and recalculate monthly.
  trend_filter_rule: At each month end, compare each risky asset-class price with
    its 10-month moving average.
  risk_on_rule: If an asset class is above its 10-month moving average, retain its
    calculated inverse-volatility weight.
  risk_off_rule: If an asset class is below its 10-month moving average, assign that
    asset class's calculated weight to US Treasury bills rather than shorting or redistributing
    to remaining risky assets.
  source_asset_classes:
  - Developed-market equities
  - Emerging-market equities
  - Government bonds
  - Broad commodities
  - Global real estate
  - US Treasury bills as risk-off
  rebalance_frequency: monthly at month end
  weighting: inverse volatility over the preceding 12 months, normalized to total
    exposure 1.0
  risk_controls: Long-only; no shorting; no project leverage; below-trend asset weights
    move to Treasury bills/cash.
  forbidden_translation_choices:
  - do_not_use_GLD_as_broad_commodities
  - do_not_use_long_duration_treasury_as_silent_world_government_bond_substitute
  - do_not_drop_missing_asset_classes
  - do_not_select_wrappers_from_prior_results
data_and_execution:
  data_requirements: Monthly or daily adjusted close history for all mapped ETF wrappers
    sufficient for 12-month volatility and 10-month moving average warm-up.
  execution_assumptions: 'Project execution assumptions are not source claims: signals
    are frozen at month end and any future screen would use the project no-lookahead
    shifted-weight convention, standard cost/slippage assumptions, and BIL as the
    Treasury-bill/cash wrapper.'
  compatible_with_bt_adapter: true
