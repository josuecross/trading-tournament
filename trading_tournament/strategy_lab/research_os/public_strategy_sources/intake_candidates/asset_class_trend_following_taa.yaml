schema_version: 1
intake_status: manual_source_supplied_for_validation
source:
  source_id: asset_class_trend_following_taa
  source_name: Asset Class Trend-Following / A Quantitative Approach to Tactical Asset Allocation
  source_url_or_citation: "Quantpedia: Asset Class Trend-Following; Mebane Faber, A Quantitative Approach to Tactical Asset Allocation"
  source_type: Quantpedia public strategy page + academic/practitioner paper
  source_evidence_public_context_only: true
strategy_description:
  strategy_family: tactical_asset_allocation_trend_following
  claimed_hypothesis: Major asset classes exhibit trend-following behavior; holding an asset only when its price is above a long-term moving average may reduce drawdowns and volatility versus buy-and-hold.
  rule_clarity: clear_and_testable
  instruments:
    - SPY
    - EFA
    - IEF
    - GLD
    - PDBC
    - BIL
  timeframe: monthly
rules:
  entry_rule: At month-end, hold an asset for the next month if its monthly close is above its 10-month simple moving average.
  exit_rule: At month-end, exit the asset and allocate that sleeve to cash/BIL if its monthly close is below its 10-month simple moving average.
  ranking_selection_rule: not_applicable_for_first_version; each asset is evaluated independently by its own 10-month SMA filter.
  rebalance_frequency: monthly, evaluated on the last trading day of each month
  risk_controls: Asset-level trend filter; BIL/cash fallback for assets below their 10-month SMA; long-only; no leverage; no shorting.
data_and_execution:
  data_requirements: Monthly or daily adjusted close data sufficient to compute 10-month SMA for each ETF; BIL used as cash proxy.
  execution_assumptions: Signals evaluated at month-end; portfolio rebalanced monthly; no intraday execution; no options/futures; no shorting; no leverage.
  compatible_with_bt_adapter: true
project_screening:
  project_constraint_violations: []
  similar_already_tested_project_families:
    - global_multi_asset
    - macro_gld_duration_risk_off
    - commodity_basket_etf_momentum
  do_not_retest_match: global_multi_asset
  allowed_next_action: validate_public_source_intake_only
