  source_url_or_citation: StockCharts ChartSchool Coppock Curve
  source_type: public practitioner / technical indicator documentation
  source_evidence_public_context_only: true
strategy_description:
  strategy_family: long_term_equity_index_momentum_zero_cross
  claimed_hypothesis: A monthly Coppock Curve zero-cross may identify long-term equity-index momentum regime changes; SPY exposure is used only when the monthly indicator is positive after a bullish zero-cross, otherwise BIL/cash is used.
  rule_clarity: clear_and_testable
  instruments:
    - SPY
    - BIL
  timeframe: monthly signal with daily cached execution/equity conversion if repository conventions require daily weights
rules:
  formula: Coppock Curve = 10-period WMA of (14-period ROC + 11-period ROC), computed on completed monthly closes.
  indicator_definitions:
    roc_periods:
      - 14
      - 11
    smoothing: 10-period weighted moving average
    signal_threshold: zero line
    data_frequency: monthly
    source_backed_parameters: true
  entry_rule: Enter or hold SPY when the monthly Coppock Curve crosses from negative territory to positive territory.
  exit_rule: Exit SPY and allocate to BIL/cash when the monthly Coppock Curve crosses from positive territory to negative territory.
  ranking_selection_rule: not_applicable; this is a single-instrument long-term equity recovery signal.
  rebalance_frequency: monthly signal check using the completed month-end close.
  risk_controls: Long-only SPY exposure; BIL/cash fallback when not in trade; no leverage; no shorting; no options/futures; no intraday execution.
data_and_execution:
  data_requirements: Local daily adjusted close data for SPY and BIL, converted to completed monthly closes sufficient to compute 14-month ROC, 11-month ROC, and 10-month WMA smoothing.
  execution_assumptions: Compute the signal only after the completed month-end close; apply target weights using the project no-lookahead shifted-weight convention on the next available trading date; BIL is the cash proxy outside active SPY positions.
  compatible_with_bt_adapter: true
