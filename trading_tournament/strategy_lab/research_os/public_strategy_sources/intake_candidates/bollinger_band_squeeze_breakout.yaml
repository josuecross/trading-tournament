schema_version: 1
intake_status: manual_source_supplied_for_validation
source:
  source_id: bollinger_band_squeeze_breakout
  source_name: Bollinger Band Squeeze Breakout
  source_url_or_citation: "StockCharts ChartSchool Bollinger Band Squeeze; StockCharts ChartSchool Bollinger BandWidth; Investopedia, \"How To Profit From the Bollinger Squeeze\""
  source_type: public practitioner / technical strategy documentation
  source_evidence_public_context_only: true
strategy_description:
  strategy_family: equity_index_volatility_contraction_breakout
  claimed_hypothesis: Periods of low volatility may precede larger directional moves; a squeeze followed by upside Bollinger Band breakout confirmation may identify long SPY entries.
  rule_clarity: needs_direction_owner_review
  instruments:
    - SPY
    - BIL
  timeframe: daily
rules:
  entry_rule: After a completed squeeze setup, enter or hold SPY only on a completed daily close above the upper Bollinger Band.
  exit_rule: Remain in or allocate to BIL/cash if no upside breakout occurs, if a downside breakout occurs, or when the bullish setup fails; the source-backed standalone exit/cash rule is explicitly incomplete and review-required before bounded design.
  ranking_selection_rule: not_applicable; this is a single-instrument volatility-contraction breakout rule.
  rebalance_frequency: daily signal check using end-of-day data.
  risk_controls: Long-only SPY exposure only after confirmed bullish upside breakout; BIL/cash fallback outside confirmed bullish states; no shorting; no inverse ETFs; no leverage; no options/futures; no margin; no intraday execution.
indicator_definitions:
  bollinger_band_period: 20
  bollinger_band_standard_deviation: 2
  bandwidth_definition: distance_between_upper_and_lower_bollinger_bands
  bandwidth_lookback_window: six_month_range_context
  squeeze_setup_definition: bandwidth_at_or_near_low_end_of_six_month_range
  upside_breakout_confirmation: completed_daily_close_above_upper_bollinger_band
  downside_breakout_interpretation: bearish_or_no_long_trade_maps_to_bil_cash
  source_backed_parameters: true
  tuned_parameters: false
  alternate_parameters_added: false
  default_status: bollinger_defaults_source_backed_but_setup_threshold_and_exit_need_direction_owner_review
data_and_execution:
  data_requirements: Daily adjusted close data for SPY and BIL sufficient to compute 20-period 2-standard-deviation Bollinger Bands, BandWidth, six-month low BandWidth context, and completed-close upper-band breakout confirmation.
  execution_assumptions: Signals are computed after daily close; target weights would use the project's no-lookahead shifted-weight convention; BIL is the cash proxy outside active SPY positions; no intraday data, provider download, broker API, paper order, live order, or real-money path is required.
  compatible_with_bt_adapter: true
