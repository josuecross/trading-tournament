project_notes:
  source_evidence_status: public_source_context_only_not_profitability_proof
  similarity_risk_vs_project: medium
  similarity_notes: This differs from completed calendar, CCI, Coppock, RSI(2), Percent B/MFI, MACD/Stochastic, global allocation, macro/risk-off, and volatility-managed lanes because it is a volatility-contraction breakout setup. Similarity remains meaningful because it is still a SPY/BIL long-only equity timing rule with volatility and breakout concepts adjacent to existing project diagnostics.
  long_only_adaptation_caveat: The public sources discuss the Squeeze as a neutral volatility-contraction setup. This intake freezes only a possible long-only SPY/BIL adaptation; bearish/downside breaks, no breakout, or unconfirmed direction map to BIL/cash, never short, inverse, leveraged, options, futures, margin, intraday, paper-order, live-order, or real-money logic.
  setup_definition_completeness_status: needs_direction_owner_review_six_month_low_threshold_not_freezable
  setup_definition_uncertainty: Sources describe BandWidth near the low end of its six-month range or six-month low volatility, but the exact threshold for "near" the low is not source-frozen enough for bounded design without direction-owner review.
  directional_confirmation_completeness_status: needs_direction_owner_review_extra_confirmation_not_source_backed_enough_to_freeze
  directional_confirmation_uncertainty: Sources state the Squeeze itself has no directional clue and often requires band break confirmation and/or other technical analysis; this intake records upper-band close as bullish context but does not invent extra confirmation indicators.
  exit_rule_completeness_status: needs_direction_owner_review_exit_rule_not_source_backed_enough_to_freeze
  exit_rule_uncertainty: The sources are clearer on squeeze setup and breakout direction than on a complete standalone long-only exit/cash system; failed-breakout, downside-breakout, and cash-state semantics require direction-owner review before any bounded design.
  indicator_defaults_completeness_status: bollinger_defaults_source_backed_setup_exit_review_required
  indicator_defaults_uncertainty: Bollinger Band 20-period and 2-standard-deviation defaults are source-backed intake context, but BandWidth six-month-low threshold, directional confirmation beyond band break, and exit/cash semantics remain review-required.
  expected_bridge_decision: needs_direction_owner_review
  allowed_next_action: validate_public_source_intake_only
notes:
  - Source details were manually supplied by the user/direction owner.
  - Codex did not browse, scrape, choose, or add any public source.
  - Source says the squeeze is neutral and needs band break confirmation and/or other analysis for direction; this file preserves that uncertainty.
  - Indicator defaults are source-backed intake context, not tuned parameters.
  - Setup threshold and exit/cash semantics remain blockers for bounded design.
  - Public-source presence is context only and is not proof of profitability.
