  source_name: CCI Correction
  source_url_or_citation: StockCharts ChartSchool CCI Correction
  source_type: public practitioner technical strategy documentation
  source_evidence_public_context_only: true
strategy_description:
  strategy_family: equity_index_cci_pullback_trend_bias
  claimed_hypothesis: A larger bullish trend/bias identified by weekly CCI may allow long entries after daily CCI pullbacks reverse upward.
  rule_clarity: clear_and_testable
  instruments:
    - SPY
    - BIL
  timeframe: weekly CCI trend/bias with daily CCI pullback/reversal signal
rules:
  entry_rule: During a bullish weekly CCI bias, enter or resume long SPY after daily CCI has plunged below -100 and then surges back above 0.
  exit_rule: Exit SPY to BIL/cash when weekly CCI enters bearish mode by plunging below -100.
  ranking_selection_rule: not_applicable; this is a single-instrument SPY/BIL timing rule.
  rebalance_frequency: daily signal check using completed daily close data with completed weekly CCI bias context.
  risk_controls: Long-only SPY exposure; BIL/cash fallback outside active long exposure; no shorting; no inverse ETFs; no leverage; no options/futures; no intraday execution.
indicator_definitions:
  weekly_cci_period: 26
  daily_cci_period: 26
  weekly_bullish_bias_threshold: 100
  weekly_bearish_bias_threshold: -100
  daily_pullback_threshold: -100
  daily_reversal_threshold: 0
  parameter_status: source_backed_parameters_not_tuned
  alternate_parameters_added: false
data_and_execution:
  data_requirements: Daily adjusted close data for SPY and BIL sufficient to compute 26-day CCI and completed 26-week CCI context.
  execution_assumptions: Weekly bias uses completed weekly data only; daily signals use completed daily close data only; target weights use the project no-lookahead shifted-weight convention; BIL is the cash proxy outside active SPY exposure.
  compatible_with_bt_adapter: true
