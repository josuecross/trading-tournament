  strategy_family: moving_average_trend_crossover
  claimed_hypothesis: A 50-day moving average crossing above the 200-day moving average may identify bullish equity trend regimes.
  rule_clarity: clear_and_testable
  instruments:
    - SPY
    - BIL
  timeframe: daily
rules:
  entry_rule: Buy/hold SPY when the 50-day moving average crosses above the 200-day moving average.
  exit_rule: Exit to BIL/cash when the 50-day moving average crosses below the 200-day moving average.
  ranking_selection_rule: not_applicable; this is a single-instrument moving-average crossover rule.
  rebalance_frequency: daily signal check using end-of-day data.
  risk_controls: Long-only SPY exposure; BIL/cash fallback when not in trade; no leverage; no shorting; no options/futures; no intraday execution.
data_and_execution:
  data_requirements: Daily adjusted close data for SPY and BIL sufficient to compute 50-day and 200-day simple moving averages.
  execution_assumptions: Signals are computed after daily close; target weights would use the project's no-lookahead shifted-weight convention; BIL is the cash proxy outside active SPY positions.
