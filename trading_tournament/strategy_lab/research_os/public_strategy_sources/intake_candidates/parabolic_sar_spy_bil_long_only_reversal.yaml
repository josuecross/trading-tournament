  similarity_notes: This overlaps with completed SPY/BIL timing, trend, and equity-risk-control project context, including SPY_200d and ADX/DMI, but the manually supplied source rule is Parabolic SAR stop-and-reverse state mapping rather than moving-average, DMI/ADX, calendar, mean-reversion, oscillator, price-band, allocation, macro, or volatility-managed logic.
  long_only_adaptation_caveat: Public Parabolic SAR materials can be interpreted as stop-and-reverse. This project intake freezes only a long-only SPY/BIL adaptation; bearish SAR state maps to BIL/cash, never short, inverse, leveraged, options, futures, margin, intraday, paper-order, live-order, or real-money logic.
  formula_parameter_completeness_status: parabolic_sar_af_parameters_source_backed_complete
  parabolic_sar_formula_contract_completeness_status: parabolic_sar_wilder_stockcharts_contract_v1_complete
  parabolic_sar_parameter_completeness_status: parabolic_sar_af_parameters_source_backed_complete
