schema_version: 1
intake_status: manual_source_supplied_for_validation
source:
  source_id: parabolic_sar_spy_bil_long_only_reversal
  source_name: Parabolic SAR Long-Only SPY/BIL Reversal
  source_url_or_citation: "StockCharts ChartSchool Parabolic SAR; Investopedia Parabolic SAR indicator documentation"
  source_type: public practitioner / technical indicator documentation
  source_evidence_public_context_only: true
strategy_description:
  strategy_family: equity_index_parabolic_sar_trend_reversal
  claimed_hypothesis: Parabolic SAR trend-reversal signals may identify tradable SPY trend states; BIL/cash is used outside bullish SAR states.
  rule_clarity: clear_and_testable
  instruments:
    - SPY
    - BIL
  timeframe: daily
rules:
  entry_rule: Enter SPY after completed daily Parabolic SAR flips from above price to below price; continue holding SPY while SAR remains below price.
  exit_rule: Exit SPY to BIL/cash after completed daily Parabolic SAR flips from below price to above price; hold BIL/cash while SAR remains above price.
  ranking_selection_rule: not_applicable; this is a single-instrument SPY/BIL trend-reversal timing rule.
  rebalance_frequency: daily signal check using completed daily OHLC data.
  risk_controls: Long-only SPY exposure only during bullish SAR state; BIL/cash fallback during bearish SAR state; no shorting; no inverse ETFs; no leverage; no options/futures; no margin; no intraday execution.
indicator_definitions:
  formula_contract_id: parabolic_sar_wilder_stockcharts_contract_v1
  formula_contract_status: deterministic_formula_contract_supplied_by_direction_owner
  formula_contract_source_basis: StockCharts / Investopedia public Parabolic SAR documentation plus direction-owner supplied deterministic implementation convention.
  data_contract: completed daily adjusted SPY OHLC data only; BIL is cash proxy only and is not used to compute SAR.
  parabolic_sar_acceleration_factor_start: 0.02
  parabolic_sar_acceleration_factor_increment: 0.02
  parabolic_sar_acceleration_factor_maximum: 0.20
  bullish_state: SAR dots below price indicate upward trend / bullish state.
  bearish_state: SAR dots above price indicate downward trend / bearish state.
  buy_signal: SAR flips from above price to below price on completed daily OHLC.
  sell_exit_signal: SAR flips from below price to above price on completed daily OHLC.
  rising_sar_formula: SAR_t = SAR_{t-1} + AF_{t-1} * (EP_{t-1} - SAR_{t-1})
  rising_extreme_point_definition: highest high in the current uptrend
  rising_af_update_rule: increase AF by 0.02 when a new rising EP is reached, capped at 0.20
  falling_sar_formula: SAR_t = SAR_{t-1} - AF_{t-1} * (SAR_{t-1} - EP_{t-1})
  falling_extreme_point_definition: lowest low in the current downtrend
  falling_af_update_rule: increase AF by 0.02 when a new falling EP is reached, capped at 0.20
  rising_to_falling_reversal_rule: in rising state, if current low breaches candidate SAR, reverse to falling state
  falling_to_rising_reversal_rule: in falling state, if current high breaches candidate SAR, reverse to rising state
  reversal_af_reset_rule: reset AF to 0.02 on every reversal
  reversal_sar_initialization_rule: on reversal, initialize the new SAR from the prior trend's EP
  reversal_ep_initialization_rule: on reversal, initialize the new EP from the current bar's low for falling state or current bar's high for rising state
  repository_standard_psar_utility_found: false
  initialization_convention_source: direction_owner_supplied_implementation_convention_not_trading_optimization
  initial_trend_rule: initial trend is rising if second completed close is greater than or equal to first completed close, otherwise falling
  initial_rising_sar_rule: minimum low of the first two completed bars
  initial_rising_ep_rule: maximum high of the first two completed bars
  initial_falling_sar_rule: maximum high of the first two completed bars
  initial_falling_ep_rule: minimum low of the first two completed bars
  warmup_rule: signals before stable indicator warmup must not be tradable
  first_valid_sar_date_reporting_required: true
  first_reversal_date_reporting_required: true
  first_tradable_signal_date_reporting_required: true
  initialization_sensitivity_policy: if initialization sensitivity is material in future bounded evidence, label as needs_direction_owner_review
  no_lookahead_contract: use completed daily OHLC only; target weights use the project no-lookahead shifted-weight convention; no same-day signal bar may generate and profit from exposure on that same bar
  extreme_point_update_context: Acceleration factor increases when a new extreme point is reached.
  source_backed_parameters: true
  tuned_parameters: false
  alternate_parameters_added: false
  default_status: parabolic_sar_wilder_stockcharts_contract_v1_complete_not_tuned
data_and_execution:
  data_requirements: Daily adjusted OHLC data for SPY and BIL sufficient to compute Parabolic SAR with source-backed acceleration factor start, increment, and maximum.
  execution_assumptions: Signals use completed daily OHLC data only; target weights would use the project no-lookahead shifted-weight convention; BIL is the cash proxy outside active SPY positions; no intraday data, provider download, broker API, paper order, live order, or real-money path is required.
  compatible_with_bt_adapter: true
