schema_version: 1
intake_status: manual_source_supplied_for_validation
source:
  source_id: macd_stochastic_double_cross
  source_name: MACD and Stochastic Double-Cross
  source_url_or_citation: 'Investopedia, "MACD and Stochastic: A Double-Cross Strategy"; Investopedia MACD calculation article; Investopedia stochastic oscillator article'
  source_type: public practitioner / technical strategy documentation
  source_evidence_public_context_only: true
strategy_description:
  strategy_family: equity_index_momentum_confirmation_double_cross
  claimed_hypothesis: A bullish stochastic crossover confirmed by a bullish MACD crossover may identify improving momentum in SPY; BIL/cash is used outside confirmed bullish states.
  rule_clarity: needs_direction_owner_review
  instruments:
    - SPY
    - BIL
  timeframe: daily
rules:
  entry_rule: Look for bullish stochastic and MACD crossovers occurring within a close timing window; the source says bullish crossovers should occur within two days of each other, ideally with stochastic below the 50 line, preferably with the MACD histogram already above zero or moving above zero within two days of the trade, and with the MACD crossover slightly after the stochastic crossover.
  exit_rule: Tentative long-only adaptation exits SPY to BIL/cash when the bullish confirmation state is no longer valid because MACD crosses below its signal line, or when a bearish double-cross is detected; this exit rule is explicitly flagged as potentially incomplete or insufficiently source-backed.
  ranking_selection_rule: not_applicable; this is a single-instrument SPY/BIL momentum-confirmation timing rule.
  rebalance_frequency: daily signal check using completed daily close data.
  risk_controls: Long-only SPY exposure during confirmed bullish states; BIL/cash fallback outside confirmed bullish states; optional 200-day moving average safety context is noted by the source but not frozen as an absolute project rule; no shorting; no inverse ETFs; no leverage; no options/futures; no margin; no intraday execution.
indicator_definitions:
  macd_fast_ema_period: 12
  macd_slow_ema_period: 26
  macd_signal_ema_period: 9
  stochastic_period: 14
  stochastic_signal_rule: percent_k_crosses_above_percent_d
  crossover_window_days: 2
  stochastic_preferred_below_line: 50
  macd_histogram_preferred_state: above_zero_or_moves_above_zero_within_two_days
  source_backed_parameters: true
  tuned_parameters: false
  alternate_parameters_added: false
  default_status: source_supported_but_article_interval_flexibility_requires_direction_owner_review_before_design
data_and_execution:
  data_requirements: Daily adjusted close data for SPY and BIL sufficient to compute standard MACD 12/26/9, stochastic oscillator 14-period inputs, and optional 200-day moving-average context if direction owner later freezes it.
  execution_assumptions: Signals would be computed after daily close; target weights would use the project no-lookahead shifted-weight convention; BIL is the cash proxy outside active SPY positions; no intraday data, provider download, broker API, paper order, live order, or real-money path is required.
  compatible_with_bt_adapter: true
