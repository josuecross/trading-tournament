project_notes:
  source_evidence_status: public_source_context_only_not_profitability_proof
  similarity_risk_vs_project: medium
  similarity_notes: This differs from completed calendar, CCI, Coppock, RSI(2), Percent B/MFI, global allocation, macro/risk-off, and volatility-managed lanes because it requires dual momentum-confirmation crossovers. Similarity remains meaningful because it is still a SPY/BIL long-only equity timing rule and references optional 200-day moving-average safety context.
  long_only_adaptation_caveat: The public article includes broader trading discussion. This intake freezes only a possible long-only SPY/BIL adaptation; bearish or failed confirmation maps to BIL/cash, never short, inverse, leveraged, options, futures, margin, intraday, paper-order, live-order, or real-money logic.
  exit_rule_completeness_status: needs_direction_owner_review_exit_rule_not_source_backed_enough_to_freeze
  exit_rule_uncertainty: The source is clearer on bullish entry confirmation than on a complete standalone exit/cash system; the tentative MACD-below-signal or bearish-double-cross exit must be reviewed before any bounded design.
  indicator_defaults_completeness_status: needs_direction_owner_review_article_allows_interval_setting_flexibility
  indicator_defaults_uncertainty: Standard MACD 12/26/9 and stochastic 14-period settings are documented as source-supported context, but the source discusses changing intervals/settings; these must not be optimized or treated as design-ready without direction-owner review.
  expected_bridge_decision: needs_direction_owner_review
  allowed_next_action: validate_public_source_intake_only
notes:
  - Source details were manually supplied by the direction owner.
  - Codex did not browse, scrape, choose, or add any public source.
  - Indicator defaults are source-backed intake context, not tuned parameters.
  - Exit semantics remain the main blocker for bounded design.
  - Public-source presence is context only and is not proof of profitability.
