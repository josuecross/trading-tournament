rules:
  entry_rule: Rank sector ETFs by momentum and hold the strongest sectors under a frozen bounded design if later approved.
  exit_rule: Rotate out of sectors that leave the selected top-ranked group; unused or defensive allocation goes to BIL/cash if adapted.
  ranking_selection_rule: Rank sector ETFs by source-defined momentum.
  rebalance_frequency: monthly or source-defined periodic rebalance.
  risk_controls: Long-only sector ETF exposure; optional BIL/cash adaptation; no leverage; no shorting; no options/futures; no intraday execution.
data_and_execution:
  data_requirements: Daily adjusted close data for sector ETFs and BIL sufficient to compute source-defined momentum at rebalance dates.
  execution_assumptions: Signals are computed after close at rebalance dates; target weights would use the project's no-lookahead shifted-weight convention; BIL is used only as an adapted cash proxy if needed.
