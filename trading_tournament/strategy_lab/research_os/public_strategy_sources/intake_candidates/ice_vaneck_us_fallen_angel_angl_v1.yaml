rules:
  entry_rule: Enter 100% ANGL at the first authorized execution of each frozen window.
  exit_rule: Hold actual ETF shares until window end; exit only at window end for measurement.
  sizing: 100% ANGL; no leverage.
  weighting: Single static ETF wrapper exposure; no intermediate rebalance.
  rebalance: No project-level rebalance during a window.
  fallback: No BIL switch; BIL is cash context only.
  missing_data_behavior: Missing candidate or benchmark prices invalidate the window; no forward filling.
  prohibited_overlays: No trend, rate, spread, downgrade-timing, BIL, duration hedge, leverage, or shorting overlay.
