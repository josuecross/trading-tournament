strategy_description:
  strategy_family: fallen_angel_credit_anomaly
  candidate_id: angl_static_fallen_angel_credit_v1
  economic_mechanism: Formerly investment-grade US-dollar corporate bonds downgraded to high yield may face rating-constrained selling and prior price deterioration; static ANGL exposure tests whether this segment earns a repeatable credit recovery premium versus broad high yield.
  strategy_role: return_seeking_credit_allocation
  primary_benchmark: HYG
  rule_clarity: clear_for_static_wrapper_screen_after_cache_gate
  instruments:
  - ANGL
  - HYG
  - BIL
  - IEF
  timeframe: daily adjusted close data, sampled bounded windows and full common period
source_facts:
  direct_wrapper: ANGL seeks to track the ICE US Fallen Angel High Yield 10% Constrained Index.
  eligible_bonds: Below-investment-grade US-dollar corporate bonds that were investment grade when issued; after the December 31, 2023 amendment, limited original-issue high-yield bonds from already represented obligors may qualify when senior or senior secured.
  mechanism: Possible recovery after rating-related selling and prior price deterioration.
  fund_inception: April 10, 2012
  current_fund_objective: ANGL seeks to track the ICE US Fallen Angel High Yield 10% Constrained Index.
  benchmark_history: ANGL reported benchmark history used the ICE BofA US Fallen Angel High Yield Index before February 28, 2020 and the ICE US Fallen Angel High Yield 10% Constrained Index from February 28, 2020 onward.
  methodology_amendment_2023: Effective December 31, 2023, the current index methodology was amended so that, in addition to bonds rated investment grade at issuance, the index may include in limited circumstances original-issue high-yield bonds from an obligor whose bonds are already included, provided the additional bonds are senior or senior secured.
  post_2023_exposure_purity_caveat: Post-2023 ANGL should not be described as consisting exclusively of securities that were investment grade at issuance.
  evidence_balance: Forced-selling mechanism is plausible but academic findings are mixed.
  sponsor_performance_policy: Source-reported and sponsor-reported performance is non-project evidence and must not enter project evidence.
