    main_risk: diluted upside, regime whipsaw, and defensive drag
    allowed_next_action: run_profit_exploration
    forbidden_next_actions: [tune_lookback, tune_sma_length, tune_parameters, grid_search, promote_to_real_money, add_broker_integration, modify_paper_forward_rules]
    canonical_rule:
      strategy_family: asset_class_time_series_momentum
      asset_universe: [SPY, GLD, IEF, BIL]
      rebalance_frequency: monthly
      ranking_lookback_trading_days: 126
      trend_filter: price_gt_200_day_sma
      cash_fallback_rule: all_to_BIL_if_no_risky_asset_eligible
      number_of_selected_assets: all_eligible
      weighting_rule: equal_weight_all_eligible
      execution_timing_rule: next_trading_day_after_rebalance_signal
      max_gross_exposure: 1.0
      leverage_setting: none
